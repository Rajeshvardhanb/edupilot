services:
  mysql:
    image: mysql:8.4
    container_name: edupilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: edupilot_root
      MYSQL_DATABASE: edupilot
      MYSQL_USER: edupilot
      MYSQL_PASSWORD: edupilot
    ports:
      - "3307:3306"
    volumes:
      - edupilot-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pedupilot_root"]
      interval: 5s
      retries: 20

  # The app itself, built for production. Started only with `npm run prod:up` (profile "prod");
  # day-to-day development still uses `npm run dev`. It comes back by itself after a reboot.
  app:
    profiles: ["prod"]
    build: .
    container_name: edupilot-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      # Inside Docker the database is reached by its service name, not localhost.
      DATABASE_URL: mysql://root:edupilot_root@mysql:3306/edupilot
      APP_URL: ${PROD_URL:-http://localhost:8080}
    ports:
      - "${PROD_PORT:-8080}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      # Read-only view of the backups folder, so Administration → System health can show the latest backup.
      - ./backups:/app/backups:ro

  # Nightly database backup. Starts with the app (profile "prod"): a compressed dump every 24 hours into
  # ./backups, the newest 14 kept, and a second copy into BACKUP_MIRROR_DIR when that is set in .env
  # (point it at another disk, a NAS share or a cloud-synced folder).
  backup:
    profiles: ["prod"]
    image: mysql:8.4
    container_name: edupilot-backup
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: edupilot_root
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backups:/backups
      - ${BACKUP_MIRROR_DIR:-./backups}:/mirror
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/edupilot-$$(date -u +%Y-%m-%d-%H-%M).sql.gz
          if mysqldump --protocol=TCP -h mysql -uroot --single-transaction --no-tablespaces --routines --hex-blob edupilot | gzip > "$$f.part" && [ -s "$$f.part" ]; then
            mv "$$f.part" "$$f"; echo "backup written: $$f"
            ls -1t /backups/edupilot-*.sql.gz | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f
            [ /mirror -ef /backups ] || cp "$$f" /mirror/ 2>/dev/null && true
          else
            rm -f "$$f.part"; echo "backup FAILED" >&2
          fi
          sleep 86400
        done

volumes:
  edupilot-mysql:
